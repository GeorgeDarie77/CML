lab:
  description: MPLS VPN - FIG 18.13 from CCNP Enterprise Advanced Routing ENRASI 300-410
    Oficial Cert Guide
  notes: |-
    <img src="Z:/img1.png" alt="Figure 18-13">

    Customer A  uses BGP on ingress side of MPLS and uses OSPF on egress side

    [CE_A_R1] ───(EBGP)───► [PE_R3] ───(MP-iBGP VPNv4)───► [PE_R5] ───(OSPF 100)───► [CE_A_R2]

    Customer B uses OSPF on ingress side of MPLS and uses BGP on egress side

    [CE_B_R1] ───(OSPF 200)───► [PE_R3] ───(MP-iBGP VPNv4)───► [PE_R5] ───(EBGP)───► [CE_A_R2]

    Ping from Customer A site 1 to Customer A site 2 shall use the source loopback 1 because the 10.0.100.0/30 is not advertised into BGP and the ping will try to use the WAN-link!

    Same story for Customer B site 2 to Customer B site 1. In both situation the BGP is used!

    For oposite direction, for the mentioned cases,  the OSPF used and the link between CE routers and PE routers is advertised!
  title: MPLS VPN
  version: 0.3.0
