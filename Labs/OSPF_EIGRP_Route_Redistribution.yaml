lab:
  description: Redistribute routes between OSPF and EIGRP
  notes: |-
    # Mutual redistribution
    <strong>Mutual</strong> means that *redistribution* is done in both directions.
    <strong style="color: blue">R<sub>2</sub></strong> will do the mutual redistribution because it has one interface in **OSPF** and another into **EIGRP**.

     <hr>

    ### Initial IP configuration
    <details>
    <summary><strong style="color: red">R<sub>1</sub></strong> IP interface configuration</summary>
    <pre>
    R1#sh ip int brief | exclude un
    Interface                  IP-Address      OK? Method Status                Protocol
    GigabitEthernet0/0         10.1.1.1        YES NVRAM  up                    up
    GigabitEthernet0/1         172.16.10.1     YES NVRAM  up                    up
    Loopback0                  1.1.1.1         YES NVRAM  up                    up
    </pre>
    </details>

    <details>
    <summary><strong style="color: blue">R<sub>2</sub></strong> IP interface configuration</summary>
    <pre>
    R1#sh ip int brief | exclude un
    Interface                  IP-Address      OK? Method Status                Protocol
    GigabitEthernet0/0         10.1.1.1        YES NVRAM  up                    up
    GigabitEthernet0/1         172.16.10.1     YES NVRAM  up                    up
    Loopback0                  1.1.1.1         YES NVRAM  up                    up
    </pre>
    </details>

    <details>
    <summary><strong style="color: green">R<sub>3</sub></strong> IP interface configuration</summary>
    <pre>
    R1#sh ip int brief | exclude un
    Interface                  IP-Address      OK? Method Status                Protocol
    GigabitEthernet0/0         10.1.1.1        YES NVRAM  up                    up
    GigabitEthernet0/1         172.16.10.1     YES NVRAM  up                    up
    Loopback0                  1.1.1.1         YES NVRAM  up                    up
    </pre>
    </details>
     <hr>

    ### Initial routing protocol configuration
    <details>
    <summary><strong style="color: red">R<sub>1</sub></strong> OSPF process</summary>
    <pre>
    R1#sh run | sec router
    router ospf 110
     router-id 1.1.1.1
    </pre>
    </details>
