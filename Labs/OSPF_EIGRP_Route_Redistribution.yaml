    ### Configure redistribution of OSPF routes into EIGRP
    <details>
    <summary>Redistribute OSPF into EIGRP on <strong style="color: blue">R<sub>2</sub></strong></summary>
    <pre>
    R2#conf t
    R2(config)#router eigrp 1
    R2(config-router)#redistribute ospf 110
    .
    R2#sh run | sec eigrp
    router eigrp 1
     network 20.1.1.0 0.0.0.3
     <strong style="color: magenta">redistribute ospf 110</strong>
     eigrp router-id 2.2.2.2
    </pre>
    </details>

    <strong style="color: red">BUT NO ROUTES ON</strong> <strong style="color: green">R<sub>3</sub></strong> <strong style="color: red">!!! </strong>
    <details>
    <summary>Topology table on <strong style="color: green">R<sub>3</sub></strong></summary>
    <pre>
    R3#sh ip eigrp topo
    P 20.1.1.0/30, 1 successors, FD is 2816
            via Connected, GigabitEthernet0/0
    P 192.168.1.0/24, 1 successors, FD is 2816
            via Connected, GigabitEthernet0/1
    P 3.3.3.3/32, 1 successors, FD is 128256
            via Connected, Loopback0
    </pre>
    </details>
    <strong style="color: firebrick">WHY?</strong>

    <strong style="color: darkorchid">**Because default seed metric is set to infinity an EIGRP will not install the routes!!!**</strong>

    <strong style="color: firebrick">How to solve it?</strong>

    <strong style="color: deepskyblue">**Set default metric before redistribution**</strong>
    <details>
    <summary>Set default metric for EIGRP process on <strong style="color: blue">R<sub>2</sub></strong></summary>
    <pre>
    R2#conf t
    R2(config)#router eigrp 1
    R2(config-router)#default-metric 1000000 1 255 1 1500
    </pre>
    </details>

    <details>
    <summary>Check the results on <strong style="color: green">R<sub>3</sub></strong></summary>
    External routes are install in the routing table. Check for code D EX and AD = 170.
    EIGRP topology will show the external routes as Passive routes.
    <pre>
    R3#sh ip route
          1.0.0.0/32 is subnetted, 1 subnets
    <strong style="color: magenta">D EX     1.1.1.1 [170/3072] via 20.1.1.1, 00:01:50, GigabitEthernet0/0
          2.0.0.0/24 is subnetted, 1 subnets
    D EX     2.2.2.0 [170/3072] via 20.1.1.1, 00:01:50, GigabitEthernet0/0</strong>
          3.0.0.0/32 is subnetted, 1 subnets
    C        3.3.3.3 is directly connected, Loopback0
          10.0.0.0/30 is subnetted, 1 subnets
    <strong style="color: magenta">D EX     10.1.1.0 [170/3072] via 20.1.1.1, 00:01:50, GigabitEthernet0/0 </strong>
          20.0.0.0/8 is variably subnetted, 2 subnets, 2 masks
    C        20.1.1.0/30 is directly connected, GigabitEthernet0/0
    L        20.1.1.2/32 is directly connected, GigabitEthernet0/0
          172.16.0.0/24 is subnetted, 1 subnets
    <strong style="color: magenta"> D EX     172.16.10.0 [170/3072] via 20.1.1.1, 00:01:50, GigabitEthernet0/0</strong>
          192.168.1.0/24 is variably subnetted, 2 subnets, 2 masks
    C        192.168.1.0/24 is directly connected, GigabitEthernet0/1
    L        192.168.1.1/32 is directly connected, GigabitEthernet0/1


    R3#sh ip eigrp topo
    P 20.1.1.0/30, 1 successors, FD is 2816
            via Connected, GigabitEthernet0/0
    <strong style="color: magenta">P 172.16.10.0/24, 1 successors, FD is 3072
            via 20.1.1.1 (3072/2816), GigabitEthernet0/0</strong>
    <strong style="color: magenta"> P 2.2.2.0/24, 1 successors, FD is 3072
            via 20.1.1.1 (3072/2816), GigabitEthernet0/0</strong>
    P 192.168.1.0/24, 1 successors, FD is 2816
            via Connected, GigabitEthernet0/1
    P 3.3.3.3/32, 1 successors, FD is 128256
            via Connected, Loopback0
    <strong style="color: magenta">P 10.1.1.0/30, 1 successors, FD is 3072
            via 20.1.1.1 (3072/2816), GigabitEthernet0/0
    P 1.1.1.1/32, 1 successors, FD is 3072
            via 20.1.1.1 (3072/2816), GigabitEthernet0/0</strong>
    </pre>
    </details>
