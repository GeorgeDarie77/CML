    ### Configure redistribution of EIGRP routes into OSPF
    <details>
    <summary>Redistribute OSPF into EIGRP on <strong style="color: blue">R<sub>2</sub></strong></summary>
    <pre>
    R2#conf t
    R2(config)#router ospf 110
    R2(config-router)#redistribute eigrp 1 subnets
    </pre>
    </details>

    <strong style="color: darkorchid">**Default seed metric is set to 20 when redistribute EIGRP routes into OSPF!!!**</strong>
    <strong style="color: firebrick">Pay attention to the key *subnets* in the redistribution command!</strong>
