          key = TacacsPwd
          accounting file = /var/log/tacplus-acct.log
          acl = default {
            permit = 0.0.0.0
          }
          host = 0.0.0.0 {
            prompt = "TACACS+ auth: "
          }
          group = netadmin {
            default service = permit
            service = exec {
              priv-lvl = 15
            }
          }
          group = netoper {
            default service = permit
            service = exec {
              priv-lvl = 1
            }
          }
          user = $enab15$ {
            login = cleartext admin123
          }
          user = tacadmin {
            login = cleartext admin123
            member = netadmin
          }
          user = tacoper {
            login = cleartext oper123
            member = netoper
          }
          user = george {
              login = cleartext geopwd
              member = netadmin
          }
      - name: boot.sh
        content: |-
          # insert more commands here
          ip address add dev eth0 192.168.1.254/24
          ip link set dev eth0 up
          ip route add default via 192.168.1.1 dev eth0
          #
          # keep the next line to indicate that the machine is ready
          echo "READY" >/dev/console
          #exit 0
          /bin/sh
