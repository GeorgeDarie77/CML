lab:
  description: "\nCE Router will play 2 roles:\na)\tdhcp server for end nodes: DHCPServ1,\
    \ SysLog, NetTools\nb)\tdhcp relay agent for end nodes: Clients and Printers\n\
    DHCPServ1 will be serve as a dhcp server for Clients and Printers in different\
    \ VLANs.\nClient1, Printer1 in VLAN 10 and Client2, Printer2 in VLAN20. Printers\
    \ will receive a static IP from the pools that are allocated to the VLAN."
  notes: ''
  title: 4.4 Troubleshoot IPv4 and IPv6 DHCP - Part 2 - with VLANs
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
