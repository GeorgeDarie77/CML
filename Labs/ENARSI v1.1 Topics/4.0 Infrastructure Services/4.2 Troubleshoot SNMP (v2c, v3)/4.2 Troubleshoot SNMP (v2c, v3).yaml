  description: |-
    ENARSI 300-401 v1.2 - Topic: 4.2 Troubleshoot SNMP (v2c, v3)
    Playground for SNMP
    - v2c
    - v3
    Use external connector to connect to an external monitoring tool such as PRTG and also for a different syslog server. Use snmpwalk embedded in the NetTools container to interrogate the node for different OIDs. Use also a syslogserver internal to the topology!
