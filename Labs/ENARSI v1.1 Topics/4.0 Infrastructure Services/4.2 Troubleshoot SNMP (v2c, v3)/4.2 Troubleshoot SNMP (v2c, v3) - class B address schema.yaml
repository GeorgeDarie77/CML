lab:
  description: |-
    ENARSI 300-401 v1.2 - Topic: 4.2 Troubleshoot SNMP (v2c, v3)
    Playground for SNMP
    - v2c
    - v3
    Use external connector to connect to an external monitoring tool such as PRTG and also for a different syslog server. Use snmpwalk embedded in the NetTools container to interrogate the node for different OIDs. Use also a syslogserver internal to the topology!
  notes: |-
    External connectors connectivity <br>
    Add to windows machine: <br>
    route add 172.16.1.0 mask 255.255.255.0 192.168.x.x -dhcp address received by the CE router on G0/0 interface  for data traffic<br>
    route add 172.16.2.0 mask 255.255.255.0 192.168.x.x <br>
    route add 172.16.3.0 mask 255.255.255.0 192.168.x.x <br>
    route add 172.16.12.0 mask 255.255.255.0 192.168.x.x <br>

    route add 172.16.10.0 mask 255.255.255.0 192.168.x.x  - dhcp address received by the CE router on G0/4 interface  for management traffic<br>
    route add 172.16.30.0 mask 255.255.255.0 192.168.x.x <br>
    route add 172.16.20.0 mask 255.255.255.0 192.168.x.x <br>
    route add 172.16.120.0 mask 255.255.255.0 192.168.x.x <br>

    Add these static routes any time you start the lab. They are not persisted. To persist them use -p parameter

    THIS SETTINGS WILL ALLOW EXTRNAL PRGT TOOL TO REACH THE DEVICES FROM CML TOPOLOGY VIA MANAGEMENT CONNECTION

    ========== OTHER USEFUL COMMANDS IN WINDOWS =========
    Method 1 - Using cmd prompt
    1. Print routes
    route print

    To filter for specific routes, you can pipe the output: route print | findstr "10.0.0".

    2. Add a Route

    • Temporary Route (disappears after a reboot):cmd
    route add 10.0.0.0 mask 255.255.255.0 192.168.1.254

    • Persistent Route (saves to the registry and survives a system reboot):cmd
    route -p add 10.0.0.0 mask 255.255.255.0 192.168.1.254

    (Syntax: route add [destination_network] mask [subnet_mask] [gateway_ip])

    3. Delete a Route

    To delete a specific static route (removes both temporary and persistent versions):
    cmd
    route delete 10.0.0.0 mask 255.255.255.0 192.168.1.254

    • Quick Delete: You can often just specify the destination IP: route delete 10.0.0.0.
    • Clear All: To clear all non-default static routes from the routing table, use route -f.

    Method 2: Using PowerShell

    If you prefer modern PowerShell cmdlets, you can utilize the Microsoft NetTCPIP Module.

    1. Show Routes

    powershell
    Get-NetRoute


    2. Add a Route

    By default, New-NetRoute creates a persistent route unless you specify the -PolicyStore ActiveStore flag.
    powershell
    New-NetRoute -DestinationPrefix "10.0.0.0/24" -NextHop "192.168.1.254" -InterfaceAlias "Ethernet"


    3. Delete a Route

    powershell
    Remove-NetRoute -DestinationPrefix "10.0.0.0/24" -NextHop "192.168.1.254"
