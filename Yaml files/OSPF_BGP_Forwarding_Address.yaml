lab:
  description: |-
    OSPF Type 5 LSAs include a field known as the forwarding address that optimizes forwarding traffic when the source uses a shared network segment. The scenario defined in
    RFC 2328 is not common but is shown in the topology. OSPF is enabled on all the links in Area 0 except for network 10.123.1.0/24. R1 forms an eBGP session with R2 (the ASBR), which then redistributes the AS 100 route 192.168.1.1/32 into the OSPF domain. R3 has direct connectivity to R1 but does not establish a BGP session with R1.
  notes: |-
    The OSPF forwarding address changes from 0.0.0.0 to the next-hop IP address in the source routing protocol when:
    ■■ OSPF is enabled on the ASBR’s interface that points to the next-hop IP address.
    ■■ That interface is not set to passive.
    ■■ That interface is a broadcast or nonbroadcast OSPF network type.


    In the above topology, when the OSPF is enabled on R2’s 10.123.1.2 interface and the interface is a broadcast network type, the forwarding address has changed from 0.0.0.0 to 10.123.1.1.
  title: OSPF_BGP_Forwarding_Address
  version: 0.3.0
