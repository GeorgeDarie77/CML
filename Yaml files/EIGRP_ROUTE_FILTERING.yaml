lab:
  description: Simulate EIGRP Stuck in Action situation
  notes: |
    Simulate Stuck in Action behaviour

    1. Activate debug traces on each router
    debug eigrp packets terse
    2. Change the hold-time for
     a) G0/0 on R1 (300 seconds)
       conf t
       int g0/0
       ip hold-time eigrp 1 300
    b) G0/0 on R2 (300 seconds - 5 minutes)
     conf t
    router eigrp SIA
    address-familiy ipv4 unicast autonomous-system 1
    af-interface g0/0
    hold-time 300
    3. Deactivate the link between R1 and R2
    Adjacency will still be up until the hold-timer will expire

    4. Shut down the loopback 0 interface on R3
    R3 will send a query to R2
    R2 swill send a query to R1 because the adjacency is still up
    R2 will wait the ACK from R1 which will not come
    R3 will send an SIA request to R2 and and SIA ACK will be sent by R2 because is still waiting a response from R1
    When the hol-time will expire R2 will responde to R3 that there is no route to 3.3.3.0 and R3 will remove the route from topology table
    The adjacencz between R1 and R2 will tear down because of the hold-timer expire
  title: EIGRP SIA
  version: 0.3.0
