lab:
  description: |-
    IPSec over GRE Tunnel
    Use IKEv2
  notes: |-
    # IP Info #
    - R1-ISP: 203.0.111.0/24 (ISP = .100, R1 = .1)
    - R2-ISP: 203.0.112.0/24 (ISP = .100, R2 = .2)
    - R2-R3: 192.168.23.0/24 (R2 = .2, R3 = .3)

    🔹 R1 Configuration

    # ① IKEv2 Proposal (Used in ② )#
    crypto ikev2 proposal IKEV2-PROP <br>
     encryption aes-cbc-256 <br>
     integrity sha256 <br>
     group 14 <br>

    _____________________

    # ② IKEv2 Policy (implicit use) #
    crypto ikev2 policy IKEV2-POL
     proposal IKEV2-PROP

    _____________________

    # ③ IKEv2 Profile ( Used in ⑥, Uses ④) #
    crypto ikev2 profile IKEV2-PROFILE  <br>
     match identity remote address 203.0.113.2 255.255.255.255  <br>
     authentication local pre-share  <br>
     authentication remote pre-share  <br>
     keyring local IKEV2-KEYRING  <br>

    _____________________

    # ④ Keyring (Used in ③) #
    crypto ikev2 keyring IKEV2-KEYRING  <br>
     peer R2  <br>
      address 203.0.113.2  <br>
      pre-shared-key CISCO123  <br>

    _____________________

    # ⑤ IPsec Transform-set (Used in ⑥) #
    crypto ipsec transform-set TS esp-aes esp-sha-hmac  <br>
     mode transport  <br>

    _____________________

    # ⑥ IPsec Profile (Used in ⑦, Uses ③ and ⑤) #
    crypto ipsec profile IPSEC-PROFILE  <br>
     set transform-set TS  <br>
     set ikev2-profile IKEV2-PROFILE  <br>

    _____________________

    # ⑦ GRE Tunnel (Uses ⑥) #
    interface Tunnel0  <br>
     ip address 10.0.0.1 255.255.255.252  <br>
     tunnel source GigabitEthernet0/0  <br>
     tunnel destination 203.0.113.2  <br>
     tunnel protection ipsec profile IPSEC-PROFILE  <br>

    _____________________

    🔹 R2 Configuration (Mirror Image)

    Veification:  <br>
    Ping from R3 to R4  <br>

    show crypto ikev2 saWhat it tells you: Verifies the Phase 1 IKEv2 tunnel state.What to look for: The state must say READY. If it is empty or says IN_NEG, authentication, identities (match identity), or IKEv2 proposals are mismatched.show crypto ipsec saWhat it tells you: Displays the encryption/decryption engine details for Phase 2.What to look for: Ensure the status is ACTIVE. Most importantly, check that the #pkts encaps and #pkts decaps counters are increasing when you generate traffic. If encaps increases but decaps stays at 0, the remote end is dropping or not receiving the packets.show crypto ipsec sa | include identWhat it tells you: A quick filter to verify the exact proxy identities.What to look for: For GRE over IPsec, the local and remote idents must show protocol 47 (GRE) and your underlay public IPs, not your private subnets.2. The Tunnel Layer (GRE Verification)These commands ensure the GRE tunnel interface itself is operational and processing the encapsulated traffic.show interfaces tunnel 0What it tells you: Displays the interface hardware and line protocol status.What to look for: It must read Tunnel0 is up, line protocol is up. Check the Tunnel source and Tunnel destination to ensure they match your physical interfaces.show ip interface brief | include TunnelWhat it tells you: A quick summary of your logical tunnel interface health.What to look for: Ensure the status is up/up and the assigned internal IP address (10.x.x.x) is correct.3. The Routing Layer (OSPF/Overlay Verification)Because GRE relies on the routing table to dictate what enters the tunnel, checking your routing topology is crucial.show ip routeWhat it tells you: Displays the active routing table matrix.What to look for: Your remote internal subnets must point to Tunnel0 as the next-hop interface. If they point out a physical interface or an ISP gateway, traffic will bypass encryption.show ip ospf neighborWhat it tells you: Verifies dynamic routing neighbor relationships.What to look for: The neighbor state across Tunnel0 must be FULL. If it stays in INIT or EXSTART, you have an MTU mismatch or an OSPF network type conflict on the tunnel.show ip ospf interface tunnel 0What it tells you: Breaks down OSPF timers and network types inside the GRE tunnel.What to look for: Verify that the Network Type (typically POINT_TO_POINT) and the Hello/Dead timers match perfectly on both sides.4. Advanced Debug Commands (Use with Caution)If the show commands look clean but traffic is still failing, use targeted debugs. Always use specific filters to avoid overwhelming the router CPU.debug crypto ikev2: Troubleshoots Phase 1 negotiation, identity matching, and keyring keys.debug crypto ipsec: Troubleshoots Phase 2 transform-set mismatches and proxy ID rejections.debug ip ospf hello: Shows if OSPF packets are being received/dropped over the virtual interface.
  title: IPSEC - GRE - IKEv2
  version: 0.3.0
