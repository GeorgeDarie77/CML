lab:
  description: |-
    Change the routing behaviour by using a PBR.
    The client PC (subnet) is using a default route to the internet.
    With PBR applied on the ingress we can change the path used by the clients.
    Topology - A PC 2 ISP and an Internet.
  notes: ''
  title: Policy based route
  version: 0.3.0
