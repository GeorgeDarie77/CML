lab:
  description: |-
    With
    filtering, routes can be matched against:
    ■■ Access control lists (ACLs) (named or numbered)
    ■■ IP prefix lists
    ■■ Route maps
    ■■ Gateway IP addresses
  notes: |
    router eigrp LAB<br>
     !<br>
     address-family ipv4 unicast autonomous-system 100<br>
      !<br>
      topology base<br>
       distribute-list FILTER-R1-10.1.100.X in<br>
       distribute-list <b>prefix </b> FILTER-R3-10.3.100.X out<br>
      exit-af-topology<br>
      network 172.16.12.0 0.0.0.255<br>
      network 172.16.23.0 0.0.0.255<br>
      network 172.16.24.0 0.0.0.255<br>
      eigrp router-id 2.2.2.2<br>
     exit-address-family<br>

    <br>
    ip access-list standard FILTER-R1-10.1.100.X<br>
     deny   10.1.100.0<br>
     permit any<br>
    !<br>
    !<br>
    ip prefix-list FILTER-R3-10.3.100.X seq 5 deny 10.3.100.0/24<br>
    ip prefix-list FILTER-R3-10.3.100.X seq 10 permit 0.0.0.0/0 le 32<br>

    On R2: <br>
    10.1.100.0/0 is filtered out on ingress<br>
    10.3.100.X is still visible <br>
    <b>but</b><br>
    On R4 <br>
    10.3.100.0/24 is no longer advertised
  title: EIGRP Router filtering
  version: 0.3.0
